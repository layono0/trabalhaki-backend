# Trabalhaki Backend Configuration
spring.application.name=backend
server.port=8080

# Active profile: dev (default uses H2 with MySQL/MariaDB syntax compatibility)
spring.profiles.active=dev

# H2 Database for local development
spring.datasource.url=jdbc:mariadb://localhost:3306/trabalhaki
spring.datasource.driverClassName=org.mariadb.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=root
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT Configuration
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.access-token-expiration-ms=86400000
jwt.refresh-token-expiration-ms=604800000

# SpringDoc OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Production MariaDB profile reference:
# Activated via --spring.profiles.active=prod or SPRING_PROFILES_ACTIVE=prod
