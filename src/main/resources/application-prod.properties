# Production configuration for MariaDB
spring.datasource.url=jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:trabalhaki}?useSSL=false&serverTimezone=UTC
spring.datasource.driverClassName=org.mariadb.jdbc.Driver
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Validador de certificados Python embarcado
cert.validator.auto-start=${CERT_VALIDATOR_AUTO_START:true}
cert.validator.port=${CERT_VALIDATOR_PORT:8090}
cert.validator.url=${CERT_VALIDATOR_URL:http://localhost:${cert.validator.port:8090}}
cert.validator.python-dir=${CERT_VALIDATOR_PYTHON_DIR:trabalhaki-cert-validator}
cert.validator.python-executable=${CERT_VALIDATOR_PYTHON_EXECUTABLE:python3}
cert.validator.startup-timeout-ms=${CERT_VALIDATOR_STARTUP_TIMEOUT_MS:8000}
